<div class="div-main">
  <h2 class="h2-certificates">
    Certifications
  </h2>

  <ul class="ul">
    <li class="li" *ngFor="let cert of certificates">
      <div class="div-title">
        {{ cert.title }}
        <span class="span-year">
          ({{ cert.year }})
        </span>
      </div>
      <div class="div-description">
        {{ cert.description }}
      </div>
      <div>
        <a [href]="cert?.link" target= "_blank">{{cert.link}}</a>
      </div>
    </li>
  </ul>
</div>
