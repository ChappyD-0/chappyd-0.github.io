  <div class="main-div">
  <h2 class="title">Skills</h2>
  <ul class="ul">
    <li *ngFor="let sk of skills" class="li">
      <div class="div-skill">
        <span class="span-skill"> {{ sk.skill }} </span>
        <span class="span-level"> {{ sk.level }} </span>
      </div>
    </li>
  </ul>
</div>
